services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Переопределяем подключение к БД на внутреннюю сеть compose
    # (значения из .env, рассчитанные на локальную разработку, игнорируются).
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    ports:
      # Только localhost: вебхуки не используются, наружу порт не торчит.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
